<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>doctask-tej-thakar Architecture Diagram</title>
  <desc>System architecture showing React UI, FastAPI backend, LangGraph pipeline, PostgreSQL, and MCP server layers</desc>

  <!-- Background -->
  <rect width="900" height="620" fill="#f8fafc" rx="0"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Insurance Claims Analysis System — Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#64748b">doctask-tej-thakar · FastAPI + LangGraph + PostgreSQL + MCP</text>

  <!-- ── LAYER 1: User / Agents ─────────────────────────────────────────── -->
  <text x="20" y="85" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#94a3b8">USER &amp; MACHINE INTERFACES</text>

  <!-- React UI box -->
  <rect x="20" y="93" width="220" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">React Review UI</text>
  <text x="130" y="128" text-anchor="middle" font-size="10" fill="#3b82f6">localhost:3000</text>
  <text x="130" y="143" text-anchor="middle" font-size="10" fill="#60a5fa">Upload · Status · Review · Report · Cost</text>
  <text x="130" y="156" text-anchor="middle" font-size="10" fill="#60a5fa">Polls /api/runs/{id} every 3 s</text>

  <!-- MCP Clients box -->
  <rect x="270" y="93" width="220" height="70" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="380" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">MCP Clients</text>
  <text x="380" y="128" text-anchor="middle" font-size="10" fill="#7c3aed">Any agent / Claude Code</text>
  <text x="380" y="143" text-anchor="middle" font-size="10" fill="#8b5cf6">upload_documents · approve_item</text>
  <text x="380" y="156" text-anchor="middle" font-size="10" fill="#8b5cf6">reject_item · resume_run · get_report</text>

  <!-- ── LAYER 2: API ──────────────────────────────────────────────────── -->
  <text x="20" y="185" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#94a3b8">API LAYER</text>

  <!-- FastAPI -->
  <rect x="20" y="193" width="340" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="190" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">FastAPI Backend</text>
  <text x="190" y="228" text-anchor="middle" font-size="10" fill="#16a34a">localhost:8000</text>
  <text x="190" y="243" text-anchor="middle" font-size="10" fill="#4ade80">POST /api/runs · GET /api/runs/{id} · /review/{item}/approve · /resume · /watch</text>

  <!-- MCP Server -->
  <rect x="380" y="193" width="200" height="60" rx="8" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5"/>
  <text x="480" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#86198f">MCP Server</text>
  <text x="480" y="228" text-anchor="middle" font-size="10" fill="#a21caf">stdio transport · port 8001</text>
  <text x="480" y="243" text-anchor="middle" font-size="10" fill="#c026d3">8 tools — machine-callable HITL</text>

  <!-- ── LAYER 3: Agent Pipeline ──────────────────────────────────────── -->
  <text x="20" y="277" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#94a3b8">LANGGRAPH PIPELINE (PostgresSaver checkpointing)</text>

  <!-- Pipeline background -->
  <rect x="20" y="285" width="760" height="100" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>

  <!-- Node boxes -->
  <!-- classify -->
  <rect x="34" y="300" width="88" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="78" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">classify</text>
  <text x="78" y="329" text-anchor="middle" font-size="9" fill="#b45309">doc_type</text>

  <!-- arrow -->
  <line x1="122" y1="319" x2="140" y2="319" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- extract -->
  <rect x="140" y="300" width="88" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="184" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">extract</text>
  <text x="184" y="329" text-anchor="middle" font-size="9" fill="#b45309">facts + verify</text>

  <line x1="228" y1="319" x2="246" y2="319" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- reconcile -->
  <rect x="246" y="300" width="88" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="290" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">reconcile</text>
  <text x="290" y="329" text-anchor="middle" font-size="9" fill="#b45309">conflicts + HTML</text>

  <line x1="334" y1="319" x2="352" y2="319" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- hitl_gate_1 -->
  <rect x="352" y="296" width="94" height="46" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="399" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">HITL gate 1</text>
  <text x="399" y="327" text-anchor="middle" font-size="9" fill="#b91c1c">conflicts review</text>
  <text x="399" y="338" text-anchor="middle" font-size="9" fill="#ef4444">⏸ pauses run</text>

  <line x1="446" y1="319" x2="464" y2="319" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- rule_check -->
  <rect x="464" y="300" width="88" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="508" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">rule_check</text>
  <text x="508" y="329" text-anchor="middle" font-size="9" fill="#b45309">rulebook → pass/fail</text>

  <line x1="552" y1="319" x2="570" y2="319" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- hitl_gate_2 -->
  <rect x="570" y="296" width="94" height="46" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="617" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">HITL gate 2</text>
  <text x="617" y="327" text-anchor="middle" font-size="9" fill="#b91c1c">findings review</text>
  <text x="617" y="338" text-anchor="middle" font-size="9" fill="#ef4444">⏸ pauses run</text>

  <line x1="664" y1="319" x2="682" y2="319" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- watcher -->
  <rect x="682" y="300" width="88" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="726" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">watcher</text>
  <text x="726" y="329" text-anchor="middle" font-size="9" fill="#b45309">new docs (Stage 3)</text>

  <!-- Checkpoint label -->
  <text x="400" y="372" text-anchor="middle" font-size="10" fill="#d97706" font-style="italic">PostgresSaver writes checkpoint after every node — survives kill -9</text>

  <!-- ── LAYER 4: Services ────────────────────────────────────────────── -->
  <text x="20" y="410" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#94a3b8">SERVICES</text>

  <!-- LLM client -->
  <rect x="20" y="418" width="190" height="55" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="115" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">LLM Client</text>
  <text x="115" y="450" text-anchor="middle" font-size="10" fill="#c2410c">call_llm() → Anthropic Claude</text>
  <text x="115" y="464" text-anchor="middle" font-size="10" fill="#ea580c">call_llm_with_superdocs()</text>

  <!-- Doc parser -->
  <rect x="225" y="418" width="190" height="55" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="320" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Document Parser</text>
  <text x="320" y="450" text-anchor="middle" font-size="10" fill="#c2410c">pypdf · python-docx · magic</text>
  <text x="320" y="464" text-anchor="middle" font-size="10" fill="#ea580c">no OCR in v1 (fails loudly)</text>

  <!-- safe_wrap -->
  <rect x="430" y="418" width="190" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="525" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Injection Defense</text>
  <text x="525" y="450" text-anchor="middle" font-size="10" fill="#b91c1c">safe_wrap() on every doc</text>
  <text x="525" y="464" text-anchor="middle" font-size="10" fill="#dc2626">&lt;document_content&gt; boundary</text>

  <!-- Cost tracker -->
  <rect x="635" y="418" width="145" height="55" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="712" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Cost Tracker</text>
  <text x="712" y="450" text-anchor="middle" font-size="10" fill="#c2410c">StageMetric per node</text>
  <text x="712" y="464" text-anchor="middle" font-size="10" fill="#ea580c">$0.003/1k in · $0.015/1k out</text>

  <!-- ── LAYER 5: Data ─────────────────────────────────────────────────── -->
  <text x="20" y="498" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#94a3b8">DATA LAYER</text>

  <!-- Postgres -->
  <rect x="20" y="506" width="530" height="90" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="285" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">PostgreSQL 15 + pgvector</text>

  <!-- Tables -->
  <rect x="32" y="532" width="72" height="28" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="68" y="551" text-anchor="middle" font-size="9" fill="#0284c7">runs</text>

  <rect x="114" y="532" width="72" height="28" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="150" y="551" text-anchor="middle" font-size="9" fill="#0284c7">documents</text>

  <rect x="196" y="532" width="72" height="28" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="232" y="551" text-anchor="middle" font-size="9" fill="#0284c7">run_logs</text>

  <rect x="278" y="532" width="72" height="28" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="314" y="551" text-anchor="middle" font-size="9" fill="#0284c7">findings</text>

  <rect x="360" y="532" width="82" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="401" y="551" text-anchor="middle" font-size="9" fill="#dc2626">review_items</text>

  <rect x="452" y="532" width="84" height="28" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="494" y="551" text-anchor="middle" font-size="9" fill="#0284c7">stage_metrics</text>

  <text x="285" y="585" text-anchor="middle" font-size="10" fill="#0ea5e9">Vector(1536) embeddings on documents · IVFFlat cosine index · all tables keyed by run_id</text>

  <!-- LangGraph checkpoints box -->
  <rect x="565" y="506" width="215" height="90" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="672" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">LangGraph Checkpoints</text>
  <text x="672" y="542" text-anchor="middle" font-size="10" fill="#7c3aed">PostgresSaver</text>
  <text x="672" y="557" text-anchor="middle" font-size="10" fill="#8b5cf6">thread_id = run_id</text>
  <text x="672" y="572" text-anchor="middle" font-size="10" fill="#8b5cf6">serialised GraphState JSON</text>
  <text x="672" y="587" text-anchor="middle" font-size="10" fill="#8b5cf6">survives kill -9</text>

  <!-- ── CONNECTING ARROWS ─────────────────────────────────────────────── -->

  <!-- React → FastAPI -->
  <line x1="130" y1="163" x2="130" y2="193" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
  <text x="135" y="182" font-size="9" fill="#94a3b8">REST</text>

  <!-- MCP Client → MCP Server -->
  <line x1="380" y1="163" x2="460" y2="193" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
  <text x="420" y="182" font-size="9" fill="#94a3b8">stdio</text>

  <!-- FastAPI → Pipeline -->
  <line x1="190" y1="253" x2="280" y2="285" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
  <text x="198" y="272" font-size="9" fill="#94a3b8">invoke</text>

  <!-- MCP Server → Pipeline -->
  <line x1="480" y1="253" x2="480" y2="285" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <!-- Pipeline → Services -->
  <line x1="400" y1="385" x2="320" y2="418" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <!-- Pipeline → DB -->
  <line x1="400" y1="385" x2="400" y2="506" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <!-- ── DEFS ─────────────────────────────────────────────────────────── -->
  <defs>
    <marker id="arrow-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
